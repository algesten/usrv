[package]
name = "usrv"
version = "0.0.0"
authors = ["Martin Algesten <martin@algesten.se>"]
description = "Simple, safe HTTP server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/algesten/usrv"
readme = "README.md"
keywords = ["web", "request", "https", "http", "server"]
categories = ["web-programming::http-server"]
edition = "2021"
exclude = ["/cargo_deny.sh", "/deny.toml", "/test.sh"]

[features]
default = []
json = ["dep:serde", "dep:serde_json"]

[dependencies]
# ureq-proto = { version = "0.4.0", default-features = false, features = ["server"] }
ureq-proto = { path = "../ureq-proto", default-features = false, features = ["server"] }
log = "*"

serde = { version = "1.0.138", optional = true, default-features = false, features = ["std"] }
serde_json = { version = "1.0.120", optional = true, default-features = false, features = ["std"] }
